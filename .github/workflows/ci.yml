name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nerd
          POSTGRES_PASSWORD: nerd_password
          POSTGRES_DB: nerd_gym_bros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerd -d nerd_gym_bros"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: nerd_gym_bros
      DB_USER: nerd
      DB_PASSWORD: nerd_password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check gymProj

      - name: Ruff format check
        run: uv run ruff format --check gymProj

      - name: Migrate database
        working-directory: gymProj
        run: uv run python manage.py migrate --noinput

      - name: Pytest
        run: uv run pytest
