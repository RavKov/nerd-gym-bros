{% extends "gymApp/login_layout.html" %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-vh-100 bg-body-tertiary d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 520px;">
    <div class="border border-3 border-primary rounded-4 shadow-sm bg-white p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="text-uppercase small text-primary fw-semibold">Nerd Gym Bros</div>
        <h1 class="h4 mb-1">Sign in</h1>
        <p class="text-body-secondary mb-0">Use your account credentials to continue.</p>
      </div>

      {% crispy form %}


    </div>
  </div>
</div>

{% endblock %}
