{% extends "gymApp/layout.html" %}

{% block title %}{{ equipment.name }}{% endblock %}

{% block content %}

<div class="container mt-5 p-4 border border-3" >
    <h2>{{ equipment.name }}</h2>

    <table class="table table-bordered table-striped">
        <tr>
            <td class="fw-bold">Name</td>
            <td>{{ equipment.name }}</td>
        </tr>
    </table>

    <a href="{% url 'equipment_list' %}" class="btn btn-secondary">Go back to list</a>
    <a href="{% url 'equipment_update' equipment.pk %}" class="btn btn-warning">Edit</a>
    <a href="{% url 'equipment_delete' equipment.pk %}" class="btn btn-danger">Delete</a>
</div>
{% endblock %}
