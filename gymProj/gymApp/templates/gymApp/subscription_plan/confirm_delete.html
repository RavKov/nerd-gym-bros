{% extends "gymApp/layout.html" %}

{% block title %}Confirm Delete Subscription Plan{% endblock %}

{% block content %}

<div class="container mt-5 p-4 border border-3" >
    <h2>Are you sure you want to delete this subscription plan?</h2>
    <p>Name: <strong>{{ subscription_plan.name }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'subscription_plan_list' %}" class="btn btn-secondary ms-3">Cancel</a>

    </form>
</div>
{% endblock %}
