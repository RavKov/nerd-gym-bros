{% extends "gymApp/layout.html" %}

{% block title %}Confirm Delete Feature Request{% endblock %}

{% block content %}

<div class="container mt-5 p-4 border border-3" >
    <h2>Are you sure you want to delete this feature request?</h2>
    <p>Title: <strong>{{ feature_request.title }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'new_feature_request_list' %}" class="btn btn-secondary ms-3">Cancel</a>

    </form>
</div>
{% endblock %}
