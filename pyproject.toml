[project]
name = "nerd-gym-bros"
version = "0.1.0"
description = "Backend and admin panel for an integrated gym training management system (engineering thesis project)."
keywords = ["django", "drf", "fitness", "gym", "workout"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=2025.6",
    "django>=5.2.8",
    "django-bootstrap-icons>=0.9.0",
    "django-cors-headers>=4.9.0",
    "django-crispy-forms>=2.5",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "docxtpl>=0.16.8",
    "drf-spectacular>=0.29.0",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.6",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.1",
    "reportlab>=4.2.5",
    "stripe>=14.2.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gymProj.settings"
pythonpath = ["gymProj"]
testpaths = ["gymProj"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["gymProj"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"gymProj/gymApp/models/__init__.py" = ["F403"]
"gymProj/gymApp/views/__init__.py" = ["F403"]
"gymProj/**/__init__.py" = ["F401"]
"gymProj/gymApp/views/admin_page.py" = ["E402"]
