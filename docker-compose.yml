services:
  db:
    image: postgres:16
    container_name: nerd-gym-bros-db
    environment:
      POSTGRES_DB: nerd_gym_bros
      POSTGRES_USER: nerd
      POSTGRES_PASSWORD: nerd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerd -d nerd_gym_bros"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: nerd-gym-bros-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: development
      DJANGO_COLLECTSTATIC: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-do-not-use-in-production}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: nerd_gym_bros
      DB_USER: nerd
      DB_PASSWORD: nerd_password
      DB_HOST: db
      DB_PORT: "5432"
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
